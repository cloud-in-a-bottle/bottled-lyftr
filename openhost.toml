[app]
name = "lyftr"
version = "0.1.0"
description = "Lyftr — self-hosted workout, weightlifting and bodyweight tracker, with one-click owner SSO"
authors = ["Andrew Laack <andrew@laack.co>"]

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/_healthz"
# Lyftr is single-tenant per zone; only the owner should use it. The auth-proxy
# still serves the app's own login form to anonymous visitors (no auto-login),
# but there is no public-sharing feature, so no public paths are exposed.
public_paths = []

[resources]
memory_mb = 512
cpu_millicores = 500

[data]
app_data = true
